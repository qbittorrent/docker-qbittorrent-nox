# https://docs.docker.com/reference/compose-file

services:
  qbittorrent-nox:
    # for debugging
    #cap_add:
      #- SYS_PTRACE
    # additional arguments to `qbittorrent-nox`
    #command:
      #- --help
    container_name: qbittorrent-nox
    environment:
      # setting the *ID variables are incompatible with `read_only: true`
      #- PAGID=10000
      #- PGID=1000
      #- PUID=1000
      - QBT_LEGAL_NOTICE=${QBT_LEGAL_NOTICE}
      - QBT_VERSION=${QBT_VERSION}
      - QBT_TORRENTING_PORT=${QBT_TORRENTING_PORT}
      - QBT_WEBUI_PORT=${QBT_WEBUI_PORT}
      #- TZ=UTC
      #- UMASK=022
    # stub provided for customization; this rarely works out-of-the-box
    #healthcheck:
      #test: curl --fail --head --show-error --silent --output /dev/null http://127.0.0.1:${QBT_WEBUI_PORT} || exit 1
      #interval: 1m
      #timeout: 10s
      #retries: 3
      #start_period: 1m
      #start_interval: 20s
    image: qbittorrentofficial/qbittorrent-nox:${QBT_VERSION}
    ports:
      # for bittorrent traffic
      - ${QBT_TORRENTING_PORT}:${QBT_TORRENTING_PORT}/tcp
      - ${QBT_TORRENTING_PORT}:${QBT_TORRENTING_PORT}/udp
      # for WebUI
      - ${QBT_WEBUI_PORT}:${QBT_WEBUI_PORT}/tcp
    read_only: true
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    volumes:
      - ${QBT_CONFIG_PATH}:/config
      - ${QBT_DOWNLOADS_PATH}:/downloads
