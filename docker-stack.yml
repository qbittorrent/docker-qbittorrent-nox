# https://docs.docker.com/reference/compose-file

version: "3.8"

services:
  qbittorrent-nox:
    # for debugging
    #cap_add:
      #- SYS_PTRACE
    # additional arguments to `qbittorrent-nox`
    #command:
      #- --help
    environment:
      # setting the *ID variables are incompatible with `read_only: true`
      #- PAGID=10000
      #- PGID=1000
      #- PUID=1000
      - QBT_LEGAL_NOTICE=
      - QBT_TORRENTING_PORT=6881
      - QBT_WEBUI_PORT=8080
      #- TZ=UTC
      #- UMASK=022
    # stub provided for customization; this rarely works out-of-the-box
    #healthcheck:
      #test: curl --fail --head --show-error --silent --output /dev/null http://127.0.0.1:8080 || exit 1
      #interval: 1m
      #timeout: 10s
      #retries: 3
      #start_period: 1m
    image: qbittorrentofficial/qbittorrent-nox:latest
    ports:
      # for bittorrent traffic
      - 6881:6881/tcp
      - 6881:6881/udp
      # for WebUI
      - 8080:8080/tcp
    read_only: true
    stop_grace_period: 30m
    tmpfs:
      - /tmp
    tty: true
    volumes:
      - <your_path>/config:/config
      - <your_path>/downloads:/downloads
